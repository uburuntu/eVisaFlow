name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check toolchain versions
        run: pnpm run check:toolchain

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Biome
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test:built

      - name: Package dry-run
        run: pnpm run pack:dry

      - name: Audit production dependencies
        run: pnpm run audit

  docker:
    name: Docker
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build CLI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: evisa-flow:ci
          cache-from: type=gha,scope=ci-cli
          cache-to: type=gha,mode=max,scope=ci-cli

      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: service/Dockerfile
          push: false
          load: true
          tags: evisa-flow-bot:ci
          cache-from: type=gha,scope=ci-service
          cache-to: type=gha,mode=max,scope=ci-service

      - name: Verify service image healthcheck
        run: docker image inspect evisa-flow-bot:ci --format '{{json .Config.Healthcheck}}' | grep /ready

      - name: Smoke service health server in image
        run: |
          docker run --rm evisa-flow-bot:ci node -e "const log={info(){},warn(){},error(){}}; import('./dist/health.js').then(async ({startHealthServer})=>{const server=startHealthServer(0,log,()=>({ready:true,shuttingDown:false,startedAt:new Date().toISOString(),telegram:{ready:true,runnerRunning:true},supabase:{ready:true},queue:{active:0,waiting:0}})); await new Promise((resolve)=>setTimeout(resolve,100)); const port=server.port(); const res=await fetch('http://127.0.0.1:'+port+'/ready'); await server.close(); process.exit(res.ok?0:1);}).catch((err)=>{console.error(err); process.exit(1);})"
