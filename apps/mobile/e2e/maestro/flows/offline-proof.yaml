appId: com.evisaflow.mobile
name: Generate and persist an offline proof
tags:
  - smoke
  - critical
  - monetization
---
- launchApp:
    clearState: true
- runFlow: "../subflows/accept-disclosure.yaml"
- runFlow: "../subflows/add-fictional-profile.yaml"
- takeScreenshot: "dashboard-before-proof"
- startRecording: "offline-proof-journey"
- tapOn:
    id: "empty-get-proof"
- assertVisible:
    id: "run-purpose-screen"
- takeScreenshot: "choose-purpose"
- scrollUntilVisible:
    element:
      id: "run-start"
    direction: DOWN
- tapOn:
    id: "run-start"
- extendedWaitUntil:
    visible:
      id: "run-security-code"
    timeout: 12000
- takeScreenshot: "security-code"
- tapOn:
    id: "run-security-code"
- inputText: "123456"
- runFlow:
    when:
      platform: Android
    commands:
      - pressKey: enter
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "run-submit-code"
- extendedWaitUntil:
    visible:
      id: "saved-document-screen"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: "saved-offline-proof"
- stopRecording
- assertVisible: "ABC 123 XYZ"
- assertVisible: "Fictional eVisa proof.pdf"
- tapOn:
    id: "saved-document-copy-code"
- assertVisible: "Copied to clipboard"
- assertVisible:
    id: "saved-document-print-evisa_pdf"
- assertVisible:
    id: "saved-document-share-evisa_pdf"
- stopApp
- launchApp
- assertVisible:
    id: "family-screen"
- assertVisible: "1 document saved"
- scrollUntilVisible:
    element:
      text: ".*2 results remaining.*"
    direction: DOWN
- assertVisible: ".*2 results remaining.*"
- scrollUntilVisible:
    element:
      id: "saved-document-0"
    direction: UP
- waitForAnimationToEnd
- takeScreenshot: "dashboard-with-offline-proof"
- tapOn:
    id: "saved-document-0"
- assertVisible:
    id: "saved-document-screen"
- assertVisible: "ABC 123 XYZ"
