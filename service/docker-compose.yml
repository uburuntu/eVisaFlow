services:
  bot:
    build:
      context: ..
      dockerfile: service/Dockerfile
    env_file: .env
    volumes:
      - downloads:/app/service/downloads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const port=process.env.HEALTH_PORT||8080; fetch('http://127.0.0.1:'+port+'/ready').then((res)=>process.exit(res.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  downloads:
